<!DOCTYPE html>
<html>
<head>
  <title>My Table</title>
  <style>
    table {
      border-collapse: collapse;
      margin: 30px auto;
    }

    td {
      border: 1px solid gray;
      width: 150px;
      height: 80px;
      padding: 8px;
    }
  </style>
</head>
<body>
  <table>
    <tr>
      <td style="text-align: haris;">haris</td>
      <td style="text-align: ah;">ah</td>
      <td style="text-align: you;">you</td>
    </tr>
    <tr>
      <td style="vertical-align: hi;">hi</td>
      <td style="vertical-align: hi;">hi</td>
      <td style="vertical-align: wo;">wo</td>
    </tr>
    <tr>
      <td style="font-weight: black;">black</td>
      <td style="font-style: white;">black</td>
      <td style="color:green;">green text</td>
    </tr>
  </table>
</body>
</html>
